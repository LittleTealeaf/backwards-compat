[package]
name = "backwards-compat"
version = "1.1.0"
edition = "2024"
description = "Streamlined backwards compatibility and schema versioning for Serde"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LittleTealeaf/backwards-compat"
documentation = "https://littletealeaf.github.io/backwards-compat/"

[workspace]
members = [
    ".",
    "derive",
]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
default_instead_of_iter_empty = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
missing_assert_message = "warn"
self_named_module_files = "warn"
std_instead_of_core = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unwrap_in_result = "warn"
wildcard_dependencies = "warn"
redundant_feature_names = "warn"
renamed_function_params = "warn"
too_many_lines = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
needless_collect = { level = "allow", priority = 1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes_without_reason = "warn"

[lints]
workspace = true

[dependencies]
backwards-compat-derive = { path = "derive", version = "1.1.0" } # x-release-please-version
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
toml = "1.1"
thiserror = "2.0"
