name: Benchmarks

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Serde Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Verify benchmarks on PR
        if: github.event_name == 'pull_request'
        run: cargo bench --bench serde_bench -- --test
      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          cargo bench --bench serde_bench -- --warm-up-time 1 --measurement-time 2 | tee bench_output.txt
          {
            echo "## Criterion Benchmark Results"
            echo ""
            echo '```text'
            cat bench_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Criterion results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion
